# Catalogo de mensagens (BACKEND-SPEC-04), UTF-8. Argumentos no formato MessageFormat: {0}, {1}.
error.VALIDATION_FAILED=Há campos inválidos. Corrija-os e tente novamente.
error.RESOURCE_NOT_FOUND=Recurso não encontrado.
error.CATEGORY_NAME_DUPLICATED=Já existe uma categoria com este nome.
error.CATEGORY_IN_USE=Categoria possui lançamentos vinculados e não pode ser excluída.
error.CATEGORY_TYPE_MISMATCH=A categoria não aceita este tipo de lançamento.
error.SUBCATEGORY_PROTECTED=A subcategoria "Outros" não pode ser excluída.
error.SUBCATEGORY_NAME_DUPLICATED=Já existe uma subcategoria com este nome nesta categoria.
error.SUBCATEGORY_NOT_IN_CATEGORY=A subcategoria não pertence à categoria escolhida.
error.CATEGORY_TYPE_CONFLICT=Existem lançamentos incompatíveis com o novo tipo desta categoria.
error.UNAUTHENTICATED=Sessão inválida ou expirada.
error.INVALID_CREDENTIALS=E-mail ou senha inválidos.
error.EMAIL_ALREADY_REGISTERED=Este e-mail já está cadastrado.
error.TOO_MANY_ATTEMPTS=Muitas tentativas. Aguarde e tente novamente.
error.PASSWORD_RESET_TOKEN_INVALID=Este link é inválido ou expirou. Peça um novo.
error.CURRENCY_UNSUPPORTED=Moeda não suportada: {0}.
error.CURRENCY_MISMATCH=A moeda do aporte ({0}) deve ser igual à moeda do cofrinho ({1}).
error.CURRENCY_LOCKED=Não é possível alterar a moeda de um cofrinho com aportes.
error.MONEY_BOX_NOT_FOUND=Cofrinho não encontrado.
error.INSUFFICIENT_BALANCE=Saldo insuficiente: o saque excede o saldo do cofrinho (ou o saldo é zero).
error.INTERNAL_ERROR=Erro inesperado. Tente novamente.
error.REQUEST_NOT_SUPPORTED=Requisição não suportada.

