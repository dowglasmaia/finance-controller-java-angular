spring:
  application:
    name: api-finance-controller
  profiles:
    default: local
  # Connection comes from SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD (required outside local; no secrets here).
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  # Tracing and metrics via Spring Boot's native OpenTelemetry support (Micrometer Tracing bridge + OTLP).
  # Export is OFF by default; set OTEL_EXPORT_ENABLED=true and the standard OTEL_EXPORTER_OTLP_* variables
  # (mapped automatically by Spring Boot) to send data to an OpenTelemetry Collector.
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    export:
      otlp:
        enabled: ${OTEL_EXPORT_ENABLED:false}
  otlp:
    metrics:
      export:
        enabled: ${OTEL_EXPORT_ENABLED:false}
  logging:
    export:
      otlp:
        enabled: false
  opentelemetry:
    resource-attributes:
      deployment.environment.name: ${APP_ENV:production}
# Structured JSON logs on stdout (Spring Boot native, Logback underneath). Formats: ecs, logstash, gelf.
logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}
    ecs:
      service:
        name: ${spring.application.name}
        environment: ${APP_ENV:production}
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.dowglasmaia.financecontroller: ${LOG_LEVEL_APP:INFO}
# Identity (BACKEND-SPEC-11, ADR-012). The JWT signing secret comes ONLY from the environment (APP_JWT_SECRET,
# at least 32 bytes); startup fails when it is missing or short. Never commit a real value.
app:
  identity:
    jwt:
      secret: ${APP_JWT_SECRET:}
      issuer: ${APP_JWT_ISSUER:https://api.finance-controller.local}
      access-token-ttl: ${APP_JWT_ACCESS_TTL:15m}
    refresh-token-ttl: ${APP_REFRESH_TTL:30d}
    limiter:
      max-failures: ${APP_LOGIN_MAX_FAILURES:5}
      window: ${APP_LOGIN_WINDOW:15m}
      max-tracked-keys: 10000
    cors:
      # Comma-separated explicit frontend origins (no wildcard); empty denies every cross-origin request.
      allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
    max-request-body: 1MB
    # Refresh-token cookie, read by the controller: app.identity.cookie.secure (default true; false only in the
    # local profile, plain HTTP) and app.identity.cookie.same-site (Strict|Lax|None).
