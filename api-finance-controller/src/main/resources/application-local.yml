spring:
  # Development defaults matching the root compose.yml; the password must come from SPRING_DATASOURCE_PASSWORD (.env.example).
  datasource:
    url: jdbc:postgresql://localhost:5432/finance_controller
    username: finance
server:
  port: ${PORT:8080}
# Readable single-line logs for the terminal; every other profile emits JSON.
management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:-}] [%X{traceId:-}] %logger{36} : %msg %kvp%n"
  structured:
    format:
      console: ""
  level:
    com.dowglasmaia.financecontroller: ${LOG_LEVEL_APP:DEBUG}
app:
  password-reset:
    app-base-url: ${FC_APP_BASE_URL:http://localhost:4200}
    ttl: ${FC_PASSWORD_RESET_TTL:30m}
    mail-from: ${FC_MAIL_FROM:no-reply@finance-controller.local}
  identity:
    jwt:
      # Development-only placeholder, NOT a production secret. Real environments must set APP_JWT_SECRET.
      secret: ${APP_JWT_SECRET:dev-only-not-a-secret-change-me-0123456789abcdef}
    cors:
      allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
    cookie:
      secure: false
