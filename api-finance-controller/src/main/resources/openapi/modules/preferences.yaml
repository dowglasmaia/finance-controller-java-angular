openapi: 3.1.0
info:
    title: Preferences API
    version: 1.0.0
paths:
    /api/v1/preferences:
        get:
            tags:
                - Preferences
            summary: Obter as preferências do utilizador
            operationId: getPreferences
            description: Moeda e tema do utilizador autenticado. Quem nunca gravou recebe BRL e DARK.
            security:
                - bearerAuth: []
            responses:
                "200":
                    description: Preferências
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Preferences"
                "401":
                    $ref: ../common/responses.yaml#/components/responses/UnauthorizedResponse
        put:
            tags:
                - Preferences
            summary: Salvar as preferências do utilizador
            operationId: savePreferences
            description: Grava moeda e tema do utilizador autenticado e devolve o que ficou gravado. Valores desconhecidos
                são recusados.
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/Preferences"
            responses:
                "200":
                    description: Preferências gravadas
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Preferences"
                "400":
                    $ref: ../common/responses.yaml#/components/responses/BadRequestResponse
                "401":
                    $ref: ../common/responses.yaml#/components/responses/UnauthorizedResponse
components:
    securitySchemes:
        bearerAuth:
            $ref: ../common/security.yaml#/components/securitySchemes/bearerAuth
    schemas:
        Currency:
            type: string
            enum:
                - BRL
                - EUR
        Theme:
            type: string
            enum:
                - LIGHT
                - DARK
                - SYSTEM
        Preferences:
            type: object
            required:
                - currency
                - theme
            properties:
                currency:
                    $ref: "#/components/schemas/Currency"
                theme:
                    $ref: "#/components/schemas/Theme"
