openapi: 3.1.0
info:
  title: api-finance-controller API
  version: 1.0.0
paths:
  /api/v1/examples/{id}:
    get:
      tags: [Examples]
      operationId: getExampleById
      summary: Find an example by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExampleDto'
        '404':
          description: Not found
components:
  schemas:
    ExampleDto:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        status:
          type: string
